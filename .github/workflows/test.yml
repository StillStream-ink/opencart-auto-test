name: OpenCart UI 自动化测试

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps
    
    - name: 安装 Allure
      run: |
        curl -sL https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip -o allure.zip
        unzip allure.zip
        echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH
      if: always()
    
    - name: 运行 UI 测试
      run: |
        pytest tests/ -v --alluredir=./allure-results
      env:
        BASE_URL: http://localhost:8080/opencart
      continue-on-error: true
    
    - name: 生成 Allure 报告
      if: always()
      run: |
        if [ -d "./allure-results" ] && [ "$(ls -A ./allure-results)" ]; then
          allure generate ./allure-results -o ./allure-report --clean
        else
          echo "⚠️ 没有测试数据，生成空报告"
          mkdir -p ./allure-report
          echo "<h1>测试未运行或无数据</h1>" > ./allure-report/index.html
        fi
    
    - name: 上传 Allure 报告
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
        retention-days: 7
    
    - name: 上传测试结果
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./allure-results
        retention-days: 7
