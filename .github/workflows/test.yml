name: OpenCart UI 自动化测试

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 每天北京时间早上 6:00 自动运行（UTC 22:00 = 北京时间 06:00）
    - cron: '22 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps
    
    - name: 启动 OpenCart（使用 Docker）
      run: |
        docker run -d --name opencart -p 8080:80 \
          -e OPENCART_SERVER_NAME=localhost \
          ghcr.io/opencart/opencart:4.0.2.3
        sleep 30
    
    - name: 运行 UI 测试
      run: |
        pytest tests/ -v --alluredir=./allure-results
      env:
        BASE_URL: http://localhost:8080/opencart
    
    - name: 生成 Allure 报告
      if: always()
      run: |
        pip install allure-pytest
        allure generate ./allure-results -o ./allure-report --clean
    
    - name: 上传 Allure 报告
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
        retention-days: 7
    
    - name: 上传测试结果
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./allure-results
        retention-days: 7